<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - by Marlon Ramos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cell {
            width: 100px;
            height: 100px;
            font-size: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .cell:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 320px;
            margin: 0 auto;
        }
        .winning-cell {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { background-color: rgba(74, 222, 128, 0.3); }
            50% { background-color: rgba(74, 222, 128, 0.7); }
            100% { background-color: rgba(74, 222, 128, 0.3); }
        }
        .btn-3d {
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2), 0 3px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
        }
        .btn-3d-green {
            background-color: #4ade80;
            border-bottom: 4px solid #22c55e;
        }
        .signature {
            font-family: 'Brush Script MT', cursive;
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.7);
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 flex flex-col items-center justify-center p-4">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold mb-2 text-green-400">JOGO DA VELHA</h1>
        <p class="text-gray-400">by <span class="signature text-xl text-green-300">Marlon Ramos</span></p>
    </div>

    <div class="mb-6 text-xl">
        <div id="status" class="font-semibold text-green-300">Sua vez (X)</div>
        <div id="score" class="text-gray-400 text-sm mt-1 flex justify-center space-x-4">
            <span><i class="fas fa-user text-green-400"></i> <span id="player-score">0</span></span>
            <span><i class="fas fa-robot text-red-400"></i> <span id="computer-score">0</span></span>
            <span><i class="fas fa-handshake text-yellow-400"></i> <span id="draw-score">0</span></span>
        </div>
    </div>

    <div class="board bg-gray-800 p-2 rounded-lg shadow-lg mb-8">
        <!-- Cells will be generated by JavaScript -->
    </div>

    <button id="reset-btn" class="btn-3d btn-3d-green text-white font-bold py-3 px-6 rounded-lg mb-4 flex items-center">
        <i class="fas fa-redo mr-2"></i> Reiniciar Jogo
    </button>

    <div class="bg-gray-800 p-4 rounded-lg max-w-md text-center">
        <h3 class="text-lg font-semibold text-green-400 mb-2"><i class="fas fa-info-circle mr-2"></i>Como Jogar:</h3>
        <p class="text-gray-300 text-sm">
            Você joga como <strong class="text-green-400">X</strong> e o computador como <strong class="text-red-400">O</strong>.
            Clique em qualquer célula vazia para fazer sua jogada. O computador responderá automaticamente.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boardElement = document.querySelector('.board');
            const statusElement = document.getElementById('status');
            const resetButton = document.getElementById('reset-btn');
            const playerScoreElement = document.getElementById('player-score');
            const computerScoreElement = document.getElementById('computer-score');
            const drawScoreElement = document.getElementById('draw-score');

            let board = ['', '', '', '', '', '', '', '', ''];
            let currentPlayer = 'X'; // Player is always X
            let gameActive = true;
            let scores = { player: 0, computer: 0, draw: 0 };

            // Create board cells
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell', 'border', 'border-gray-600', 'text-green-400');
                cell.setAttribute('data-index', i);
                cell.addEventListener('click', () => handleCellClick(i));
                boardElement.appendChild(cell);
            }

            const cells = document.querySelectorAll('.cell');

            // Winning combinations
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];

            // Handle cell click
            function handleCellClick(index) {
                if (board[index] !== '' || !gameActive || currentPlayer !== 'X') return;

                // Player move
                makeMove(index, 'X');
                
                if (checkWin()) {
                    handleWin('X');
                    return;
                }

                if (checkDraw()) {
                    handleDraw();
                    return;
                }

                // Switch to computer
                currentPlayer = 'O';
                statusElement.textContent = "Vez do computador (O)";
                statusElement.className = "font-semibold text-red-300";

                // Computer move after a short delay
                setTimeout(() => {
                    if (gameActive) {
                        const bestMove = findBestMove();
                        makeMove(bestMove, 'O');
                        
                        if (checkWin()) {
                            handleWin('O');
                            return;
                        }

                        if (checkDraw()) {
                            handleDraw();
                            return;
                        }

                        // Switch back to player
                        currentPlayer = 'X';
                        statusElement.textContent = "Sua vez (X)";
                        statusElement.className = "font-semibold text-green-300";
                    }
                }, 500);
            }

            // Make a move
            function makeMove(index, player) {
                board[index] = player;
                cells[index].textContent = player;
                cells[index].classList.remove('text-green-400', 'text-red-400');
                cells[index].classList.add(player === 'X' ? 'text-green-400' : 'text-red-400');
            }

            // Check for win
            function checkWin() {
                return winningConditions.some(combination => {
                    return combination.every(index => {
                        return board[index] === currentPlayer;
                    });
                });
            }

            // Check for draw
            function checkDraw() {
                return board.every(cell => cell !== '');
            }

            // Handle win
            function handleWin(winner) {
                gameActive = false;
                
                // Highlight winning cells
                const winningCombination = winningConditions.find(combination => {
                    return combination.every(index => {
                        return board[index] === winner;
                    });
                });

                winningCombination.forEach(index => {
                    cells[index].classList.add('winning-cell');
                });

                // Update status and scores
                if (winner === 'X') {
                    statusElement.textContent = "Você ganhou! 🎉";
                    scores.player++;
                    playerScoreElement.textContent = scores.player;
                    createConfetti();
                } else {
                    statusElement.textContent = "Computador ganhou! 😢";
                    scores.computer++;
                    computerScoreElement.textContent = scores.computer;
                }
            }

            // Create confetti effect
            function createConfetti() {
                const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = -10 + 'px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(confetti);
                    
                    // Remove confetti after animation
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }
            }

            // Handle draw
            function handleDraw() {
                gameActive = false;
                statusElement.textContent = "Empate! 🤝";
                scores.draw++;
                drawScoreElement.textContent = scores.draw;
            }

            // Reset game
            function resetGame() {
                board = ['', '', '', '', '', '', '', '', ''];
                currentPlayer = 'X';
                gameActive = true;
                
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.classList.remove('winning-cell');
                    cell.classList.add('text-green-400');
                    cell.classList.remove('text-red-400');
                });
                
                statusElement.textContent = "Sua vez (X)";
                statusElement.className = "font-semibold text-green-300";
            }

            // Computer AI - Minimax algorithm
            function findBestMove() {
                // Simple AI - first try to win, then block, then random
                
                // 1. Check if computer can win in the next move
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        if (checkWin()) {
                            board[i] = '';
                            return i;
                        }
                        board[i] = '';
                    }
                }
                
                // 2. Check if player can win in the next move and block
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        if (checkWin()) {
                            board[i] = '';
                            return i;
                        }
                        board[i] = '';
                    }
                }
                
                // 3. Try to take center if available
                if (board[4] === '') return 4;
                
                // 4. Try to take a corner if available
                const corners = [0, 2, 6, 8];
                const availableCorners = corners.filter(index => board[index] === '');
                if (availableCorners.length > 0) {
                    return availableCorners[Math.floor(Math.random() * availableCorners.length)];
                }
                
                // 5. Take any available edge
                const edges = [1, 3, 5, 7];
                const availableEdges = edges.filter(index => board[index] === '');
                if (availableEdges.length > 0) {
                    return availableEdges[Math.floor(Math.random() * availableEdges.length)];
                }
                
                // Fallback - should never reach here if board isn't full
                return board.indexOf('');
            }

            // Event listeners
            resetButton.addEventListener('click', resetGame);
        });
    </script>
